# Application name
quarkus.application.name=async-profiler-mcp-server

# HTTP port
quarkus.http.port=8080

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.causa.profiler".level=DEBUG

# REST Client Configuration
quarkus.rest-client.follow-redirects=true

# Jafra Analyzer — the service that stores JFR chunks and serves report/summary endpoints
# Set JAFRA_ANALYZER_URL in your environment to point at the running analyzer instance.
quarkus.rest-client.jafra-analyzer.url=${JAFRA_ANALYZER_URL:http://localhost:8080}
quarkus.rest-client.jafra-analyzer.connect-timeout=5000
quarkus.rest-client.jafra-analyzer.read-timeout=120000

# Package as a single executable uber-jar (same as kruize-mcp-server)
quarkus.package.jar.type=uber-jar

# MCP server info
quarkus.mcp.server.server-info.name=async-profiler-mcp-server
quarkus.mcp.server.server-info.version=1.0.0

# SSE transport endpoints (quarkus-mcp-server-sse)
#   SSE stream:          GET  /mcp/sse
#   JSON-RPC messages:   POST /mcp/sse/messages
#   Streamable HTTP:     POST /mcp  (MCP spec §6.3)

# ── Jafra backend ────────────────────────────────────────────────────────────
# The jafra-analyzer owns JFR chunk storage and the endpoints.
# The jafra-controller owns sidecar injection and async-profiler invocation.
# Default Kubernetes namespace used when namespace is not supplied by the caller.
profiler.controller.default-namespace=${PROFILER_DEFAULT_NAMESPACE:default}
