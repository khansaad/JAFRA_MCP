---
apiVersion: v1
kind: Namespace
metadata:
  name: jafra-system
  labels:
    app.kubernetes.io/part-of: jafra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: async-profiler-mcp-server
  namespace: jafra-system
  labels:
    app.kubernetes.io/name: async-profiler-mcp-server
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: jafra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: async-profiler-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: async-profiler-mcp-server
        app.kubernetes.io/version: "0.1.0"
    spec:
      containers:
        - name: mcp-server
          image: quay.io/khansaad/async-profiler-mcp-server:0.1.0
          # Image is pre-loaded into Kind; always pull from node image cache.
          imagePullPolicy: IfNotPresent
          env:
            # jafra-analyzer Service in the same namespace on port 8080
            - name: JAFRA_ANALYZER_URL
              value: "http://jafra-analyzer.jafra-system.svc.cluster.local:8080"
            - name: PROFILER_DEFAULT_NAMESPACE
              value: "default"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 35
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: async-profiler-mcp-server
  namespace: jafra-system
  labels:
    app.kubernetes.io/name: async-profiler-mcp-server
    app.kubernetes.io/part-of: jafra
spec:
  selector:
    app.kubernetes.io/name: async-profiler-mcp-server
  ports:
    - name: http
      port: 8080
      targetPort: http
